name = "portfolio-cms"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Secrets are set with `wrangler pages secret put <NAME>` or in the Cloudflare dashboard:
# GITHUB_OAUTH_CLIENT_ID (variable), GITHUB_OAUTH_CLIENT_SECRET (secret),
# GITHUB_WRITE_TOKEN (secret), SESSION_SECRET (secret), ALLOWED_LOGINS (variable).
# Never commit real values. Use .dev.vars for local development.
